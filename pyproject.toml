    "pyarrow>=17",
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "pyfixest>=0.25",
    "requests>=2.32",
    "openpyxl>=3.1",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "playwright>=1.63.0",
    "rapidocr-onnxruntime>=1.4.4",
    "xlrd>=2.0.2",
    "pyreadstat>=1.3.6",
    "python-docx>=1.2.0",
]
